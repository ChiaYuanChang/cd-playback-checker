[project]
name = "compare-audio"
version = "0.1.0"
description = "CD 播放器收音比對：用麥克風錄下播放聲音，和參考音檔對齊，偵測跳針、卡住、靜音"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "soxr>=0.3.7",
    "pydantic>=2.6",
    "PySide6-Essentials>=6.6",
    "pyqtgraph>=0.13.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "matplotlib>=3.8",
]
build = [
    "pyinstaller>=6.5",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E203"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
